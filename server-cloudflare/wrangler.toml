name = "conclave-backend"
main = "./src/index.ts"
compatibility_date = "2026-05-10"
observability.enabled = true

[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "CONCLAVE_ROOM"
class_name = "ConclaveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "ConclaveRoom" ]

[[routes]]
pattern = "conclave.alea.net"
custom_domain = true